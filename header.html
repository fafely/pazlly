<html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            background-color: white;
            overflow-x: hidden;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 20px;
            background: #f6d7ef;
            color: rgb(54, 23, 146);
            min-height: 60px;
            position: relative;
            z-index: 10;
            border: 2px solid rgb(219, 42, 178);
            border-radius: 2%;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-left: 10px;
        }
        
        .logo-img:hover {
            transform: scale(1.1);
        }
        
        .burger {
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .nav-links {
            list-style: none;
            display: none;
        }
        
        .nav-links li {
            margin: 0 15px;
        }
        
        .nav-links a {
            color: rgb(54, 23, 146);
            text-decoration: none;
            transition: transform 0.3s, color 0.3s;
            position: relative;
        }
        
        .nav-links a:hover {
            transform: scale(1.05);
            color: rgb(219, 42, 178);
        }
        /* Active link */
        
        .nav-links a.active {
            color: rgb(219, 42, 178);
        }
        
        .nav-links a.active::after {
            content: '';
            display: block;
            width: 100%;
            height: 3px;
            background: #f6d7ef;
            position: absolute;
            bottom: -5px;
            left: 0;
            border: 2px solid rgb(219, 42, 178);
            border-radius: 2px;
        }
        /* Dropdown burger */
        
        .nav-links.active {
            display: flex;
            flex-direction: column;
            background: #f6d7ef;
            position: absolute;
            top: 60px;
            right: 20px;
            padding: 10px;
            border-radius: 8px;
        }
        /* Responsive */
        /* تجعل البرجر منيو  يعمل في الشاشات الصغيرة  علاقتها لاتقتصر بتخصيص الشاشة بل مهمة ولاتحذف*/
        
        @media (min-width: 768px) {
            .burger {
                display: none;
            }
            .logo-img {
                width: 60px;
                height: 60px;
            }
            .nav-links {
                display: flex;
                flex-direction: row;
                font-weight: bold;
            }
        }
        
        .page-content {
            min-height: calc(100vh - 100px);
            /* يترك مساحة للفوتر */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            padding-top: 73px;
        }
    </style>

</head>




<header>

    <nav class="navbar">

        <div class="burger">☰</div>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="#contact">تواصل معنا</a></li>
            <li><a href="about.html">من نحن</a></li>

        </ul>

        <div class="logo">
            <span>pazl.ly</span>
            <img src="images/logo.jpg" class="logo-img">
        </div>

    </nav>
</header>

<body>


</body>


</html>
